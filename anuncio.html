<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17345b">
  <meta name="robots" content="noindex,nofollow">
  <title>Anúncio interno | BancoImob</title>
  <meta name="description" content="Apresentação interna de imóvel para locação por temporada.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:'DM Sans',sans-serif;color:#242b34;background:#f6f4ef;--navy:#17345b;--gold:#b49350;--muted:#777b80;--line:#e7e1d6}
    *{box-sizing:border-box}body{margin:0;min-width:320px}a{color:inherit}.page{max-width:1120px;margin:auto;padding:26px 28px 54px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 0 22px}.brand{display:flex;align-items:center;gap:10px;color:var(--navy);font:800 18px Manrope;letter-spacing:-.5px}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#e9dfca;color:var(--navy);font-size:23px}
    .internal{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#8b7548;border:1px solid #e4d8bd;background:#fbf8f0;border-radius:30px;padding:8px 12px}
    .hero{position:relative;min-height:440px;border-radius:22px;overflow:hidden;background:#d9d7d0;display:flex;align-items:flex-end;color:#fff;isolation:isolate}
    .hero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,19,34,.82),rgba(8,19,34,.12) 70%),linear-gradient(90deg,rgba(8,19,34,.24),transparent);z-index:-1}
    .hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.hero-content{padding:clamp(26px,5vw,54px);max-width:820px}
    .eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:800;color:#e8d6aa}.hero h1{font:800 clamp(30px,5vw,54px)/1.06 Manrope;letter-spacing:-1.8px;margin:12px 0}.hero-description{max-width:700px;margin:0 0 16px;color:#f5f3ee;font-size:clamp(14px,1.7vw,17px);line-height:1.55;text-shadow:0 1px 8px #0008}.hero-location{font-size:14px;color:#f0eee9;margin:0}
    .quickfacts{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.quickfacts span{padding:9px 12px;border:1px solid #ffffff55;background:#ffffff18;backdrop-filter:blur(8px);border-radius:30px;font-size:11px;font-weight:600}
    .section{margin-top:34px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:15px}.section-kicker{font-size:9px;letter-spacing:1.7px;color:#a1844b;font-weight:800}.section h2{font:800 22px Manrope;color:var(--navy);letter-spacing:-.5px;margin:5px 0 0}
    .gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.gallery figure{margin:0;overflow:hidden;border-radius:13px;background:#e9e5dc;min-height:180px}.gallery img,.gallery video,.gallery iframe{display:block;width:100%;height:220px;object-fit:cover;border:0}.gallery figcaption{padding:9px 11px;font-size:10px;color:#6e706e;background:#fffefa}
    .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.fact{background:#fffefa;border:1px solid var(--line);border-radius:13px;padding:17px}.fact small{display:block;color:var(--muted);font-size:10px}.fact strong{display:block;color:var(--navy);font:700 17px Manrope;margin-top:7px}
    .description{background:#fffefa;border:1px solid var(--line);border-radius:15px;padding:22px;color:#50555c;font-size:14px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
    .amenities{display:flex;flex-wrap:wrap;gap:8px}.amenities span,.meta-tags span{border:1px solid #e5dcc9;background:#fbf8f0;color:#6f5a32;border-radius:30px;padding:8px 12px;font-size:11px}
    .empty-photo{display:grid;place-items:center;min-height:440px;color:#fff;background:linear-gradient(135deg,#44556b,#182e4d);font:700 14px Manrope}
    .footer{margin-top:46px;border-top:1px solid var(--line);padding:22px 0 0;color:#777b80}.footer-top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.footer-brand{font:800 13px Manrope;color:var(--navy)}.footer small{font-size:10px}
    .meta-block{margin-top:20px}.meta-block>b{display:block;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#8b7548;margin-bottom:10px}.meta-tags{display:flex;flex-wrap:wrap;gap:7px}
    .loading,.error{max-width:620px;margin:12vh auto;padding:30px;background:#fffefa;border:1px solid var(--line);border-radius:16px;color:var(--navy);line-height:1.7}.error a{display:inline-block;margin-top:12px}
    @media(max-width:760px){.page{padding:14px 14px 36px}.hero{min-height:390px;border-radius:16px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery img,.gallery video,.gallery iframe{height:170px}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.section{margin-top:26px}.description{padding:17px}.empty-photo{min-height:390px}}
    @media(max-width:430px){.gallery{grid-template-columns:1fr}.gallery img,.gallery video,.gallery iframe{height:220px}.topbar{align-items:flex-start}.internal{font-size:8px}.hero h1{letter-spacing:-1px}}
  </style>
</head>
<body>
  <main id="app"><div class="loading">Preparando anúncio interno…</div></main>
  <script type="module" src="/src/anuncio.js"></script>
</body>
</html>
